[build]
  publish = "."

# Members page: same site file, opens the full-details form only
[[redirects]]
  from = "/members"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/members"
  [headers.values]
    X-Robots-Tag = "noindex"
