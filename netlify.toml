[build]
  publish = "."

# Members page: same site file, opens the full-details form only
[[redirects]]
  from = "/members"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/members"
  [headers.values]
    X-Robots-Tag = "noindex"

# Scripts, styles and translations carry a ?v= fingerprint that changes with every update,
# so browsers can keep them for a year and never ask again.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/i18n/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
